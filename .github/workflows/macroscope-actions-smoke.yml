name: Macroscope Actions Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/macroscope-actions-smoke.yml"
      - ".macroscope/check-run-agents/github-actions/**"
      - "src/**"

permissions:
  contents: read
  id-token: write

jobs:
  pr-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: macroscope
        uses: prassoai/macroscope-actions/run@0016c000f394c8403a62b376005be58956ae93d7 # sync from prassoai/back@1ae2ecee
        with:
          repository: ${{ github.repository }}
          agent: Actions PR Metadata Smoke
          commit: ${{ github.event.pull_request.head.sha }}
          pull-request: ${{ github.event.pull_request.number }}
          fail-on: failure
          timeout: "600"
          additional-instructions: |
            This is a post-merge smoke test for the reusable Macroscope action.

  full-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: macroscope
        uses: prassoai/macroscope-actions/run@0016c000f394c8403a62b376005be58956ae93d7 # sync from prassoai/back@1ae2ecee
        with:
          repository: ${{ github.repository }}
          agent: Actions Full Diff Smoke
          commit: ${{ github.event.pull_request.head.sha }}
          base: ${{ github.event.pull_request.base.sha }}
          fail-on: failure
          timeout: "600"
          additional-instructions: |
            This is a post-merge smoke test for the reusable Macroscope action.
