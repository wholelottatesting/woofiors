name: Macroscope Actions Start Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/macroscope-actions-start-smoke.yml"
      - ".macroscope/check-run-agents/github-actions/start-path-smoke.md"

permissions:
  contents: read
  id-token: write

jobs:
  start-and-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=macroscope")"
          token="$(jq -er '.value' <<<"${response}")"
          echo "token=${token}" >>"${GITHUB_OUTPUT}"

      - name: Start run and verify idempotent replay
        env:
          MACROSCOPE_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          MACROSCOPE_API_URL: https://primary.lb.webhook.staging.back.nonprod.prasso.ai/api/v1/github-actions/agent-runs
          TARGET_COMMIT: ${{ github.event.pull_request.head.sha }}
          TARGET_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          request="$(jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg agent "GitHub Actions Start Smoke" \
            --arg commit "${TARGET_COMMIT}" \
            --argjson pullRequest "${TARGET_PR}" \
            --arg idempotencyDiscriminator "pr-metadata-postdeploy-v1" \
            '{repository: $repository, agent: $agent, commit: $commit, pullRequest: $pullRequest, idempotencyDiscriminator: $idempotencyDiscriminator}')"

          first_status="$(curl --silent --show-error \
            --dump-header first-headers.txt \
            --output first-body.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${MACROSCOPE_OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${request}" \
            "${MACROSCOPE_API_URL}")"
          echo "First response: HTTP ${first_status}"
          jq . first-body.json
          test "${first_status}" = "202"
          first_run_id="$(jq -er '.runId' first-body.json)"
          jq -e '.jobToken | length > 0' first-body.json >/dev/null

          second_status="$(curl --silent --show-error \
            --dump-header second-headers.txt \
            --output second-body.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${MACROSCOPE_OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${request}" \
            "${MACROSCOPE_API_URL}")"
          echo "Replay response: HTTP ${second_status}"
          jq . second-body.json
          test "${second_status}" = "202"
          test "$(jq -er '.runId' second-body.json)" = "${first_run_id}"
          jq -e '.jobToken | length > 0' second-body.json >/dev/null
          tr -d '\r' <second-headers.txt | grep -Eiq '^x-macroscope-idempotent-replay: true$'
