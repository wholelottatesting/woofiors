name: Macroscope Actions Start Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/macroscope-actions-start-smoke.yml"
      - ".macroscope/check-run-agents/github-actions/start-path-smoke.md"

permissions:
  contents: read
  id-token: write

jobs:
  start-and-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=macroscope")"
          token="$(jq -er '.value' <<<"${response}")"
          echo "token=${token}" >>"${GITHUB_OUTPUT}"

      - name: Verify repository kill switch rejects the run
        env:
          MACROSCOPE_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          MACROSCOPE_API_URL: https://primary.lb.webhook.staging.back.nonprod.prasso.ai/api/v1/github-actions/agent-runs
          TARGET_BASE: ${{ github.event.pull_request.base.sha }}
          TARGET_COMMIT: ${{ github.event.pull_request.head.sha }}
          TARGET_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          request="$(jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg agent "GitHub Actions Start Smoke" \
            --arg base "${TARGET_BASE}" \
            --arg commit "${TARGET_COMMIT}" \
            --argjson pullRequest "${TARGET_PR}" \
            --arg idempotencyDiscriminator "kill-switch-enabled-20260909" \
            '{repository: $repository, agent: $agent, base: $base, commit: $commit, pullRequest: $pullRequest, idempotencyDiscriminator: $idempotencyDiscriminator}')"

          status="$(curl --silent --show-error \
            --output body.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${MACROSCOPE_OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${request}" \
            "${MACROSCOPE_API_URL}")"
          echo "Response: HTTP ${status}"
          jq . body.json
          test "${status}" = "403"
          jq -er '.error | contains("GitHub Actions agent runs are not enabled for repository")' body.json >/dev/null
