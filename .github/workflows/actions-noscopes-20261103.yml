name: Staging ordinary Actions Approvability 20261103
on:
  pull_request:
    branches: [smoke/actions-noscopes-20261103-base]
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  approvability:
    if: github.event.pull_request.head.ref == 'smoke/actions-noscopes-20261103-head'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      pull-requests: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SMOKE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Capture deployed source and wait for native correctness
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://primary.lb.webhook.staging.back.nonprod.prasso.ai/
          curl -fsS --max-time 20 https://primary.lb.billing.staging.back.nonprod.prasso.ai/
          for attempt in {1..96}; do
            gh api "repos/wholelottatesting/woofiors/commits/$SMOKE_HEAD/check-runs?filter=all&per_page=100" > "$RUNNER_TEMP/prerequisite.json"
            if jq -e 'any(.check_runs[]; .name=="Macroscope - Correctness Check" and .status=="completed" and (.conclusion=="success" or .conclusion=="skipped"))' "$RUNNER_TEMP/prerequisite.json" >/dev/null; then
              cat "$RUNNER_TEMP/prerequisite.json"
              exit 0
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/prerequisite.json"
          echo '::error::No successful correctness prerequisite within eight minutes'
          exit 1
      - name: Run ordinary Approvability without scopes
        id: macroscope
        uses: prassoai/macroscope-actions/run@1bdf876f18b43a15ae7b814220f86057007ac750
        with:
          api-url: https://primary.lb.webhook.staging.back.nonprod.prasso.ai
          repository: ${{ github.repository }}
          review: approvability
          commit: ${{ github.event.pull_request.head.sha }}
          base: ${{ github.event.pull_request.base.sha }}
          pull-request: ${{ github.event.pull_request.number }}
          timeout: '900'
      - name: Record ordinary outputs and GitHub side effects
        if: always()
        env:
          RUN_ID: ${{ steps.macroscope.outputs.run-id }}
          VERDICT: ${{ steps.macroscope.outputs.verdict }}
          SUMMARY: ${{ steps.macroscope.outputs.summary }}
          SMOKE_PR: ${{ github.event.pull_request.number }}
        run: |
          jq -n --arg runId "$RUN_ID" --arg verdict "$VERDICT" --arg summary "$SUMMARY" '{runId:$runId,verdict:$verdict,summary:$summary}'
          gh api "repos/wholelottatesting/woofiors/pulls/$SMOKE_PR/reviews" --jq '[.[]|{id,state,commit_id,user:.user.login,body}]'
          gh api "repos/wholelottatesting/woofiors/commits/$SMOKE_HEAD/check-runs?filter=all&per_page=100" --jq '[.check_runs[]|{id,node_id,name,status,conclusion,external_id,title:.output.title,summary:.output.summary}]'
