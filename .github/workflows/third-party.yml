name: Third Party CI

on:
  pull_request:

jobs:
  correctness-prerequisite:
    name: correctness-prerequisite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delay ambiguous reconciliation smoke fixture
        if: hashFiles('always-approve-smoke/correctness-reconciliation-ambiguous.ts') != ''
        run: sleep 45
      - name: Read smoke-test gate
        run: grep -qx pass .correctness-prerequisite

  tp-pass:
    runs-on: ubuntu-latest
    steps:
      - run: echo "deliberately succeeds"; exit 0
  tp-fail:
    runs-on: ubuntu-latest
    steps:
      - run: echo "deliberately fails"; exit 1
