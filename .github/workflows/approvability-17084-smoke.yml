name: Approvability 17084 smoke CI
on:
  pull_request:
jobs:
  build:
    if: startsWith(github.head_ref, 'smoke/approvability-17084-')
    name: smoke-17084-build
    runs-on: ubuntu-latest
    steps:
      - name: Controlled smoke outcome
        env:
          SMOKE_BRANCH: ${{ github.head_ref }}
        run: |
          case "$SMOKE_BRANCH" in
            *-running|*-missing|*-wildcard) sleep 300 ;;
            *) echo "Smoke check passed" ;;
          esac
  integration:
    if: startsWith(github.head_ref, 'smoke/approvability-17084-')
    name: smoke-17084-integration
    runs-on: ubuntu-latest
    steps:
      - name: Controlled smoke outcome
        env:
          SMOKE_BRANCH: ${{ github.head_ref }}
        run: |
          case "$SMOKE_BRANCH" in
            *-running|*-missing|*-wildcard) sleep 300 ;;
            *) echo "Smoke check passed" ;;
          esac
  lint:
    if: startsWith(github.head_ref, 'smoke/approvability-17084-')
    name: smoke-17084-lint
    runs-on: ubuntu-latest
    steps:
      - name: Controlled smoke outcome
        env:
          SMOKE_BRANCH: ${{ github.head_ref }}
        run: |
          case "$SMOKE_BRANCH" in
            *-failed|*-ordering|*-wildcard) exit 1 ;;
            *) echo "Smoke check passed" ;;
          esac
  security:
    if: startsWith(github.head_ref, 'smoke/approvability-17084-')
    name: smoke-17084-security
    runs-on: ubuntu-latest
    steps:
      - name: Controlled smoke outcome
        env:
          SMOKE_BRANCH: ${{ github.head_ref }}
        run: |
          case "$SMOKE_BRANCH" in
            *-failed|*-ordering|*-wildcard) exit 1 ;;
            *) echo "Smoke check passed" ;;
          esac
