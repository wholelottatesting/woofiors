}

function drawOver(t) {
  const cx = VW / 2;
  const w = Math.min(VW - 24, 180);
  drawPanel(cx - w / 2, 40, w, 92);
  drawTextCentered('GAME OVER', cx, 48, 2, '#ff8f9c', '#4a1420');
  drawTextCentered('LEVEL ' + level, cx, 66, 1, '#a9d8b8', '#102118');
  drawTextCentered('SCORE ' + scoreValue(), cx, 76, 2, '#ffd34d', '#5a3b0e');
  drawTextCentered('BANANAS ' + player.bananas, cx, 92, 1, P.hud, '#102118');
  drawTextCentered('BEST ' + best, cx, 102, 1, '#9ff0b4', '#102118');
  if (Math.floor(t * 2) % 2 === 0) drawTextCentered('TAP TO RETRY LEVEL ' + level, cx, 116, 1, '#ffffff', '#102118');
}

let tGlobal = 0;
function render() {
  const sx = shake > 0 ? Math.round((Math.random() - 0.5) * shake) : 0;
  const sy = shake > 0 ? Math.round((Math.random() - 0.5) * shake) : 0;

  drawSky();

  ctx.save();
  ctx.translate(sx, sy);

  drawLayer(layerFar, camX, 0.10, 0);
  drawLayer(layerMid, camX, 0.26, 0);
  drawLayer(layerNear, camX, 0.52, 0);

  // slight darkening behind play field
  ctx.globalAlpha = P.washAlpha;
  rect(-8, 0, VW + 16, VH, P.wash);
  ctx.globalAlpha = 1;

  drawFloaters();
  drawGround();
  drawLadders();
  drawGoal();
  drawObstacles();
  drawCoins();

  // player
  if (state === 'play') {
    // flash while hurt, but visible 2 frames out of 3 so he stays readable
    const hidden = player.invuln > 0 && Math.floor(tGlobal * 15) % 3 === 0;
    if (!hidden) {
      drawMonkey(player.x - camX, player.y, {
        state: player.state, phase: player.phase, face: player.face, blink: player.blink
      }, charId);
    }
  }

  drawParticles();

  // foreground bushes
  ctx.globalAlpha = 0.95;
  drawLayer(layerFg, camX, 1.35, 0);
  ctx.globalAlpha = 1;

  ctx.restore();

  // vignette-ish top/bottom shade
  ctx.globalAlpha = P.topShadeAlpha;
  rect(0, 0, VW, 10, P.topShade);
  ctx.globalAlpha = 1;

  if (state === 'play') drawHUD();
  if (state === 'title') { drawTitle(tGlobal); drawMuteBtn(); drawThemeBtn(); }
  if (state === 'select') { drawSelect(tGlobal); }   // heading occupies the mute slot
  if (state === 'complete') { drawHUD(); drawComplete(tGlobal); }
  if (state === 'over') { drawHUD(); drawOver(tGlobal); }
  drawAudioStatus();
  if (state === 'play' && player.ladderHintT > 0) {
    drawTextCentered('HOLD TO CLIMB ON - RELEASE TO GO BACK', VW / 2, VH - 16, 1, '#ffd34d', '#2a1a05');
  }

  if (flashT > 0) {
    ctx.globalAlpha = Math.min(0.5, flashT * 3);
    rect(0, 0, VW, VH, '#ff5c70');
    ctx.globalAlpha = 1;
  }
}

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;     // clamp after tab switches
  tGlobal += dt;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

// diagnostics hook (lets a remote probe read audio state without a debugger)
globalThis.MJD = {
  AU,
  get state() { return state; },
  get player() { return player; },
  get input() { return input; },
  get ladders() { return ladders; },
  get platforms() { return platforms; },
  get obstacles() { return obstacles; },
  get camX() { return camX; },
  get VW() { return VW; },
  get level() { return level; },
  get cfg() { return cfg; },
  get goal() { return goal; },
  get charId() { return charId; },
  get justUnlocked() { return justUnlocked; },
  get unlocked() { return unlocked; },
  unlockedList, charSlots, startLevel, beginFromMenu,
  get theme() { return { mode: themeMode, active: curTheme }; },
  audioInfo() {
    return {
      hasCtx: !!AU.ac,
      ctxState: AU.ac ? AU.ac.state : null,
      started: AU.started,
      muted: AU.muted,
      step: AU.step,
      masterGain: AU.master ? AU.master.gain.value : null,
      silentElPlaying: AU.silentEl ? !AU.silentEl.paused : false,
      audioSession: (navigator.audioSession && navigator.audioSession.type) || null
    };
  }
};

applyTheme();   // pick day/night from the OS before the first layer bake
resize();
resetGame();
state = 'title';
requestAnimationFrame(frame);
</script>
</body>
</html>
